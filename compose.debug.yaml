# Development-only overlay. Never include this file in a production deployment.
services:
  zeus:
    restart: "no"
    build:
      target: debug
    command:
      - sh
      - -lc
      - cargo build --locked -p zeus-api && exec gdbserver 0.0.0.0:2345 target/debug/zeus-api
    cap_add: [SYS_PTRACE]
    security_opt:
      - seccomp:unconfined
    ports:
      - "127.0.0.1:${ZEUS_API_PORT:-8081}:8081"
      - "127.0.0.1:${ZEUS_RUST_DEBUG_PORT:-2345}:2345"

  web:
    restart: "no"
    build:
      target: debug
    command:
      - sh
      - -lc
      - pnpm install --frozen-lockfile && exec pnpm --filter web exec node --inspect=0.0.0.0:9229 node_modules/vite/bin/vite.js --host 0.0.0.0 --port 3000
    ports:
      - "127.0.0.1:${ZEUS_WEB_PORT:-3000}:3000"
      - "127.0.0.1:${ZEUS_NODE_DEBUG_PORT:-9229}:9229"
