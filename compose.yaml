name: ${COMPOSE_PROJECT_NAME:-zeus}

x-common-logging: &common-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Optional PostgreSQL adapter/test target. The current authoritative Zeus
  # store is the SQLite database mounted into the zeus service below.
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6}-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeus}
      POSTGRES_USER: ${POSTGRES_USER:-zeus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeus_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA under /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]
    logging: *common-logging

  restate:
    image: docker.restate.dev/restatedev/restate:${RESTATE_VERSION:-1.7.6}
    profiles: [infra, full, debug, sandbox]
    restart: unless-stopped
    command: ["--node-name=restate-1"]
    environment:
      RESTATE_LOG_FILTER: ${RESTATE_LOG_FILTER:-restate=info}
    ports:
      - "127.0.0.1:${RESTATE_INGRESS_PORT:-8080}:8080"
      # The admin endpoint has full control over Restate; never bind it publicly.
      - "127.0.0.1:${RESTATE_ADMIN_PORT:-9070}:9070"
    volumes:
      - restate_data:/restate-data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [backend]
    logging: *common-logging

  minio:
    image: quay.io/minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    profiles: [infra, full, debug, sandbox]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p "/data/$${MINIO_BUCKET}" && exec minio server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zeus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zeus_local_only_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-zeus-artifacts}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]
    logging: *common-logging

  zeus:
    build:
      context: .
      dockerfile: infra/docker/rust.Dockerfile
      target: dev
      args:
        RUST_VERSION: ${RUST_VERSION:-1.97.1}
    profiles: [full, debug]
    init: true
    restart: unless-stopped
    # This is the cargo-watch development service, so the limits include Rust
    # compilation headroom. They are not a production runtime benchmark.
    cpus: ${ZEUS_COMPOSE_API_CPUS:-4.0}
    mem_limit: ${ZEUS_COMPOSE_API_MEMORY:-4g}
    pids_limit: ${ZEUS_COMPOSE_API_PIDS_LIMIT:-512}
    environment:
      ZEUS_LISTEN_ADDR: ${ZEUS_LISTEN_ADDR:-0.0.0.0:8081}
      ZEUS_DATABASE_PATH: ${ZEUS_DATABASE_PATH:-/var/lib/zeus/zeus.db}
      ZEUS_DEMO_PROFILE: ${ZEUS_DEMO_PROFILE:-production-guarded}
      ZEUS_LOCAL_MARKER_ROOT: ${ZEUS_LOCAL_MARKER_ROOT:-/var/lib/zeus/local-markers}
      ZEUS_COOKIE_SECURE: ${ZEUS_COOKIE_SECURE:-false}
      ZEUS_LLM_ENDPOINT: ${ZEUS_LLM_ENDPOINT:-}
      ZEUS_LLM_MODEL: ${ZEUS_LLM_MODEL:-}
      ZEUS_LLM_API_KEY: ${ZEUS_LLM_API_KEY:-}
      ZEUS_MAX_SESSIONS_PER_SCOPE: ${ZEUS_MAX_SESSIONS_PER_SCOPE-1000}
      ZEUS_MAX_SESSIONS_GLOBAL: ${ZEUS_MAX_SESSIONS_GLOBAL-10000}
      ZEUS_MAX_OPEN_TURNS_PER_SCOPE: ${ZEUS_MAX_OPEN_TURNS_PER_SCOPE-32}
      ZEUS_MAX_OPEN_TURNS_GLOBAL: ${ZEUS_MAX_OPEN_TURNS_GLOBAL-64}
      ZEUS_MAX_ACTIVE_REPLY_JOBS_PER_SCOPE: ${ZEUS_MAX_ACTIVE_REPLY_JOBS_PER_SCOPE-32}
      ZEUS_MAX_ACTIVE_REPLY_JOBS_GLOBAL: ${ZEUS_MAX_ACTIVE_REPLY_JOBS_GLOBAL-64}
      ZEUS_MAX_ACTIVE_DISPATCH_JOBS_PER_SCOPE: ${ZEUS_MAX_ACTIVE_DISPATCH_JOBS_PER_SCOPE-16}
      ZEUS_MAX_ACTIVE_DISPATCH_JOBS_GLOBAL: ${ZEUS_MAX_ACTIVE_DISPATCH_JOBS_GLOBAL-32}
      ZEUS_MAX_AUTH_SESSIONS_PER_USER: ${ZEUS_MAX_AUTH_SESSIONS_PER_USER-32}
      ZEUS_MAX_AUTH_SESSIONS_GLOBAL: ${ZEUS_MAX_AUTH_SESSIONS_GLOBAL-256}
      ZEUS_MAX_SESSION_EVENT_SLOTS_PER_SESSION: ${ZEUS_MAX_SESSION_EVENT_SLOTS_PER_SESSION-10000}
      ZEUS_MAX_RUN_EVENT_SLOTS_PER_RUN: ${ZEUS_MAX_RUN_EVENT_SLOTS_PER_RUN-50000}
      ZEUS_MAX_SESSION_EVENT_PAYLOAD_BYTES_PER_SESSION: ${ZEUS_MAX_SESSION_EVENT_PAYLOAD_BYTES_PER_SESSION-67108864}
      ZEUS_MAX_RUN_EVENT_PAYLOAD_BYTES_PER_RUN: ${ZEUS_MAX_RUN_EVENT_PAYLOAD_BYTES_PER_RUN-268435456}
      ZEUS_MAX_EVENT_PAYLOAD_BYTES_GLOBAL: ${ZEUS_MAX_EVENT_PAYLOAD_BYTES_GLOBAL-1073741824}
      ZEUS_MAX_BOOTSTRAP_AUDIT_ROWS: ${ZEUS_MAX_BOOTSTRAP_AUDIT_ROWS-1024}
      ZEUS_SQLITE_MAX_MAIN_BYTES: ${ZEUS_SQLITE_MAX_MAIN_BYTES-4294967296}
      ZEUS_SQLITE_WAL_TARGET_BYTES: ${ZEUS_SQLITE_WAL_TARGET_BYTES-16777216}
      ZEUS_SQLITE_MIN_FREE_BYTES: ${ZEUS_SQLITE_MIN_FREE_BYTES-268435456}
      ZEUS_SQLITE_ADMISSION_RESERVE_BYTES: ${ZEUS_SQLITE_ADMISSION_RESERVE_BYTES-536870912}
      ZEUS_SQLITE_MAX_CONCURRENT_OPERATIONS: ${ZEUS_SQLITE_MAX_CONCURRENT_OPERATIONS-8}
      ZEUS_SQLITE_RESERVED_PROGRESS_OPERATIONS: ${ZEUS_SQLITE_RESERVED_PROGRESS_OPERATIONS-1}
      ZEUS_SQLITE_OPERATION_ACQUIRE_TIMEOUT_MS: ${ZEUS_SQLITE_OPERATION_ACQUIRE_TIMEOUT_MS-1000}
      RESTATE_INGRESS_URL: ${RESTATE_INGRESS_URL:-http://restate:8080}
      RESTATE_ADMIN_URL: ${RESTATE_ADMIN_URL:-http://restate:9070}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-zeus}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-zeus_local_only_change_me}
      S3_BUCKET: ${MINIO_BUCKET:-zeus-artifacts}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      RUST_LOG: ${RUST_LOG:-zeus=debug,tower_http=info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}
    volumes:
      - type: bind
        source: .
        target: /workspace
      - cargo_target:/workspace/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - zeus_data:/var/lib/zeus
    depends_on:
      restate:
        condition: service_started
      minio:
        condition: service_healthy
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    networks: [frontend, backend]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging: *common-logging

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-24.18.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.33.0}
    profiles: [full, debug]
    init: true
    restart: unless-stopped
    cpus: ${ZEUS_COMPOSE_WEB_CPUS:-2.0}
    mem_limit: ${ZEUS_COMPOSE_WEB_MEMORY:-2g}
    pids_limit: ${ZEUS_COMPOSE_WEB_PIDS_LIMIT:-256}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ZEUS_API_URL: ${ZEUS_API_URL:-http://zeus:8081}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    command:
      - sh
      - -lc
      - pnpm install --frozen-lockfile && exec pnpm --filter web dev --host 0.0.0.0 --port 3000
    volumes:
      - type: bind
        source: .
        target: /workspace
      - pnpm_store:/pnpm/store
      - pnpm_root_node_modules:/workspace/node_modules
      - pnpm_web_node_modules:/workspace/apps/web/node_modules
      - pnpm_ui_node_modules:/workspace/packages/ui/node_modules
      - pnpm_eslint_node_modules:/workspace/packages/eslint-config/node_modules
      - pnpm_typescript_node_modules:/workspace/packages/typescript-config/node_modules
    depends_on:
      zeus:
        condition: service_started
    expose: ["3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    networks: [frontend, backend]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging: *common-logging

  gateway:
    image: caddy:${CADDY_VERSION:-2.10.2}-alpine
    profiles: [full, debug]
    restart: unless-stopped
    cpus: ${ZEUS_COMPOSE_GATEWAY_CPUS:-0.5}
    mem_limit: ${ZEUS_COMPOSE_GATEWAY_MEMORY:-256m}
    pids_limit: ${ZEUS_COMPOSE_GATEWAY_PIDS_LIMIT:-64}
    ports:
      - "127.0.0.1:${ZEUS_HTTP_PORT:-8088}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config
      - /data
    depends_on:
      zeus:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [frontend]
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  tool-sandbox:
    image: alpine:3.22
    profiles: [sandbox]
    init: true
    command: ["sleep", "infinity"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    logging: *common-logging

networks:
  frontend:
  backend:

volumes:
  zeus_data:
  postgres_data:
  restate_data:
  minio_data:
  cargo_target:
  cargo_registry:
  cargo_git:
  pnpm_store:
  pnpm_root_node_modules:
  pnpm_web_node_modules:
  pnpm_ui_node_modules:
  pnpm_eslint_node_modules:
  pnpm_typescript_node_modules:
