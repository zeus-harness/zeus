name: Linux container acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeus-linux-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-runtime:
    name: Release runtime and resource envelope
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ZEUS_LINUX_ACCEPTANCE_IMAGE_PREFIX: zeus-linux-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Docker runtime
        run: |
          docker version
          docker compose version
          docker info

      - name: Validate acceptance verifier
        run: |
          bash -n scripts/linux-container-acceptance.sh
          shellcheck scripts/linux-container-acceptance.sh

      - name: Normal envelope (2 CPU / 1 GiB / 128 PID)
        env:
          ZEUS_LINUX_ACCEPTANCE_PROJECT: zeus-linux-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-normal
          ZEUS_LINUX_ACCEPTANCE_PROFILE: normal
          ZEUS_LINUX_ACCEPTANCE_API_CPUS: "2.0"
          ZEUS_LINUX_ACCEPTANCE_API_MEMORY: 1g
          ZEUS_LINUX_ACCEPTANCE_API_PIDS: "128"
          ZEUS_LINUX_ACCEPTANCE_WEB_CPUS: "1.0"
          ZEUS_LINUX_ACCEPTANCE_WEB_MEMORY: 512m
          ZEUS_LINUX_ACCEPTANCE_WEB_PIDS: "128"
          ZEUS_LINUX_ACCEPTANCE_GATEWAY_CPUS: "0.5"
          ZEUS_LINUX_ACCEPTANCE_GATEWAY_MEMORY: 128m
          ZEUS_LINUX_ACCEPTANCE_GATEWAY_PIDS: "64"
          ZEUS_LINUX_ACCEPTANCE_PRESSURE_REQUESTS: "10000"
          ZEUS_LINUX_ACCEPTANCE_PRESSURE_CONCURRENCY: "64"
          ZEUS_LINUX_ACCEPTANCE_REUSE_IMAGES: "0"
        run: ./scripts/linux-container-acceptance.sh run

      - name: Low-memory envelope (1 CPU / 256 MiB / 64 PID)
        env:
          ZEUS_LINUX_ACCEPTANCE_PROJECT: zeus-linux-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-low-memory
          ZEUS_LINUX_ACCEPTANCE_PROFILE: low-memory
          ZEUS_LINUX_ACCEPTANCE_API_CPUS: "1.0"
          ZEUS_LINUX_ACCEPTANCE_API_MEMORY: 256m
          ZEUS_LINUX_ACCEPTANCE_API_PIDS: "64"
          ZEUS_LINUX_ACCEPTANCE_WEB_CPUS: "0.5"
          ZEUS_LINUX_ACCEPTANCE_WEB_MEMORY: 256m
          ZEUS_LINUX_ACCEPTANCE_WEB_PIDS: "64"
          ZEUS_LINUX_ACCEPTANCE_GATEWAY_CPUS: "0.25"
          ZEUS_LINUX_ACCEPTANCE_GATEWAY_MEMORY: 64m
          ZEUS_LINUX_ACCEPTANCE_GATEWAY_PIDS: "32"
          ZEUS_LINUX_ACCEPTANCE_PRESSURE_REQUESTS: "3000"
          ZEUS_LINUX_ACCEPTANCE_PRESSURE_CONCURRENCY: "32"
          ZEUS_LINUX_ACCEPTANCE_REUSE_IMAGES: "1"
        run: ./scripts/linux-container-acceptance.sh run

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-linux-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: .zeus-linux-acceptance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
