[workspace]
members = [
    "apps/zeus-api",
    "crates/*"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Fynn Tang <fzpying@gmail.com>"]
description = ""
homepage = "https://github.com/zeus-harness/zeus"
repository = "https://github.com/zeus-harness/zeus.git"
publish = false

[workspace.dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["json", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4.3"
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
rusqlite = { version = "0.37.0", features = ["bundled"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
zeroize = "1.8.1"

authz = { path = "crates/authz" }
connectors = { path = "crates/connectors" }
deployment = { path = "crates/deployment" }
kernel = { path = "crates/kernel" }
llm = { path = "crates/llm" }
protocol = { path = "crates/protocol" }
runtime = { path = "crates/runtime" }
storage = { path = "crates/storage" }
tenancy = { path = "crates/tenancy" }
tools = { path = "crates/tools" }
workflows = { path = "crates/workflows" }
