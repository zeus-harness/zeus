openapi: 3.1.0
info:
  title: Zeus API
  description: Enterprise Harness Agent control plane and durable execution API.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /api/v1/auth/context:
    post:
      tags:
      - identity
      operationId: select_identity_context
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectIdentityContextRequest'
        required: true
      responses:
        '204':
          description: Session tenant context selected
        default:
          description: Problem Details error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      - serviceAccountBearer: []
  /api/v1/auth/email-verifications:
    post:
      tags:
      - identity
      operationId: request_email_verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAddressRequest'
        required: true
      responses:
        '202':
          description: Verification request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedIdentityResponse'
        default:
          description: Problem Details error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - {}
  /api/v1/auth/email-verifications/confirm:
    post:
      tags:
      - identity
      operationId: confirm_email_verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenConfirmationRequest'
        required: true
      responses:
        '204':
          description: Email verified
        default:
          description: Problem Details error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - {}
  /api/v1/auth/login:
    post:
      tags:
      - identity
      operationId: native_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeLoginRequest'
        required: true
      responses:
        '200':
          description: Native login completed or awaiting MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeLoginResponse'
        '401':
          description: Credentials rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - {}
  /api/v1/auth/logout:
    post:
      tags:
      - identity
      operationId: native_logout
      responses:
        '204':
          description: Current web session revoked
        default:
          description: Problem Details error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      - serviceAccountBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - identity
      operationId: current_user
      responses:
        '200':
          description: Current authenticated principal
          content:
